version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15.4-alpine
    container_name: residuos-postgres
    environment:
      POSTGRES_DB: residuos_db
      POSTGRES_USER: residuos_user
      POSTGRES_PASSWORD: residuos_password_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U residuos_user -d residuos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - residuos-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: residuos-backend
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: residuos_db
      DB_USER: residuos_user
      DB_PASSWORD: residuos_password_dev
      
      # App
      APP_ENV: development
      LOG_LEVEL: DEBUG
      
      # CORS
      CORS_ORIGINS: "http://localhost:3000,http://localhost:80"
    ports:
      - "8002:8002"
    volumes:
      - ./backend/app:/app/app:ro
      - ./codes.xlsx:/app/codes.xlsx:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - residuos-network
    restart: unless-stopped

  # React Frontend (Development)
  frontend-dev:
    image: node:18-alpine
    container_name: residuos-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://localhost:8002/residuos/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - residuos-network
    profiles:
      - dev

  # React Frontend (Production - Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: residuos-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - residuos-network
    profiles:
      - prod

volumes:
  postgres_data:
    driver: local

networks:
  residuos-network:
    driver: bridge
